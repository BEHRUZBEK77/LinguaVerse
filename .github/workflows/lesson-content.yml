# ════════════════════════════════════════════════════════════════════════════
# QO'LDA YOZILGAN DARSLAR → SAYT
# content/<native>/<lang>/A1-01.json o'zgarsa: tekshiradi, Supabase'ga yozadi
# (saytda dars shu matn bilan ochiladi) va ssenariylar/ diktor matnini yangilaydi.
# ════════════════════════════════════════════════════════════════════════════
name: Darslar saytga

on:
  push:
    branches: [main]
    paths: ["content/**", "scripts/lesson-content.mjs", "scripts/lesson-script-export.mjs"]
  workflow_dispatch:

concurrency:
  group: lesson-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tekshirish va Supabase'ga yozish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/lesson-content.mjs --push
      - name: Diktor matnini repoga yozish
        run: |
          git config user.name "darslar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ssenariylar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Diktor matni yangilandi [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
