# Bepul ikkinchi manzil (linguaverse.pages.dev) — asosiy Worker'ga ulanadigan eshik.
# Bir marta ishga tushirish kifoya; sayt yangilanishlari avtomatik ko'rinadi.
name: Ikkinchi manzil (pages.dev)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node cloudflare/pages-gateway.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LINGUAVERSE_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
