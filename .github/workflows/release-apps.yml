name: Build and publish LinguaVerse apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiya (masalan v2.2.0)'
        required: true
env:
  TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  actions: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.AppImage
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android assembleDebug
      - name: Prepare release APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LinguaVerse-${TAG}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LinguaVerse-*-android-universal.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and website links
    needs: [desktop, android]
    # Android yiqilsa ham kompyuter ilovalari chiqaveradi
    if: always() && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.apk' \))
          echo "$files"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" $files --clobber; gh release edit "$TAG" --draft=false;
          else gh release create "$TAG" $files --target "$GITHUB_SHA" --title "LinguaVerse $TAG" --generate-notes; fi
      - name: Update website download manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ env.TAG }}
        run: node scripts/update-release-manifest.mjs "$RUNNER_TEMP/releases.json"
      - name: Deploy links through the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp "$RUNNER_TEMP/releases.json" downloads/releases.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/releases.json
          if git diff --cached --quiet; then
            echo "Download manifest is already current."
          else
            git commit -m "Update app download links for $TAG"
            # Boshqa workflow'lar ham main'ga yozadi — rebase qilib, 3 marta urinamiz
            for i in 1 2 3; do
              git pull --rebase origin "$DEFAULT_BRANCH" && git push origin "HEAD:$DEFAULT_BRANCH" && exit 0
              echo "Push urinishi $i muvaffaqiyatsiz, qayta urinamiz..."
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            echo "Push 3 urinishdan keyin ham bajarilmadi" >&2
            exit 1
          fi
      - name: Saytni yangilash (yuklab olish havolalari)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref "${{ github.event.repository.default_branch }}" -R "$GITHUB_REPOSITORY"
