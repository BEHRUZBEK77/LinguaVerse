# ════════════════════════════════════════════════════════════════════════════
# VIDEO FABRIKA — AI o'zi barcha MP4 darslarni yaratadi
#
# 8 til × 150 dars. Har 15 daqiqada navbatni tekshiradi: o'quvchi ochgan,
# MP4 i hali yo'q dars bo'lsa — shu til uchun runner ochib, darsni yasaydi
# (AI ssenariy → ustoz ovozi → 1080p montaj → Cloudflare R2). Navbat bo'sh
# bo'lsa ~10 soniyada tugaydi. GITHUB_TOKEN kerak emas.
#
# Qo'lda: GitHub → Actions → "Video fabrika" → Run workflow
# (yoki admin panel → Video fabrika → "Hozir ishga tushirish")
#
# BEPUL REJIM (standart): faqat o'quvchilar ochgan darslarga MP4 yasaladi,
# ovoz Azure bepul limiti ichida (oyiga ~450 000 belgi), video Cloudflare R2 da.
#
# GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   (R2 o'rniga Firebase: FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL,
#    FIREBASE_PRIVATE_KEY, FIREBASE_STORAGE_BUCKET)
# AI va ElevenLabs kalitlari admin paneldan (Firestore) o'qiladi.
# ════════════════════════════════════════════════════════════════════════════
name: Video fabrika

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 daqiqada: o'quvchilar ochgan darslar bormi? (token kerak emas)
  workflow_dispatch:
    inputs:
      langs:
        description: "Tillar: all yoki english,russian,..."
        required: false
        default: all
      native:
        description: "Ona tili / tushuntirish tili"
        type: choice
        options: [uz, en, ru, es, de, tr, ar, ko, zh]
        default: uz
      batch:
        description: "Har bir runner bitta ishga tushishda nechta dars (30 daqiqalik dars ~50 daqiqada tayyor bo'ladi)"
        required: false
        default: "4"
      voice:
        description: "Ovoz: azure (bepul limit ichida) yoki auto (ElevenLabs, bo'lmasa Azure)"
        type: choice
        options: [azure, auto]
        default: azure
      lesson:
        description: "Bitta dars (sayt o'zi yuboradi): til:kurs:raqam, masalan english:b2:0"
        required: false
        default: ""
      mode:
        description: "demand = faqat o'quvchilar ochgan darslar (bepul rejim) · all = barcha 150 dars"
        type: choice
        options: [demand, all]
        default: demand

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.m.outputs.jobs }}
      run: ${{ steps.m.outputs.run }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_LANGS: ${{ github.event.inputs.langs }}
          REQUESTED_NATIVE: ${{ github.event.inputs.native }}
          ONE_LESSON: ${{ github.event.inputs.lesson }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}\n`);
          const allowed = ['english','russian','spanish','german','turkish','arabic','korean','chinese'];
          const natives = ['uz','en','ru','es','de','tr','ar','ko','zh'];
          (async () => {
            let jobs = [];
            if (process.env.EVENT === 'schedule') {
              // Navbatni tekshiramiz: o'quvchilar ochgan, MP4 i hali yo'q va hozir yasalmayotgan darslar
              const u = process.env.SUPABASE_URL, k = process.env.SUPABASE_SERVICE_ROLE_KEY;
              if (!u || !k) { console.log('SUPABASE_* secrets yo\'q — o\'tkazib yuborildi'); out('run', 'false'); out('jobs', []); return; }
              const q = `${u}/rest/v1/docs?select=data&col=eq.courseLessons&data->>videoWanted=eq.true&data->>videoPath=is.null&limit=500`;
              const r = await fetch(q, { headers: { apikey: k, Authorization: `Bearer ${k}` } });
              if (!r.ok) throw new Error('Supabase: ' + r.status);
              const stale = t => !t || Date.now() - Date.parse(t.$t || t) > 3 * 3600_000;
              const rows = (await r.json()).map(x => x.data).filter(d => stale(d.videoRenderingAt) && allowed.includes(d.lang) && natives.includes(d.nativeLang || 'uz'));
              const seen = new Set();
              for (const d of rows) { const key = `${d.lang}|${d.nativeLang || 'uz'}`; if (!seen.has(key)) { seen.add(key); jobs.push({ lang: d.lang, native: d.nativeLang || 'uz' }); } }
              console.log(`Navbatda ${rows.length} ta dars → ${jobs.length} ta runner`);
            } else {
              const one = process.env.ONE_LESSON || '';
              if (one && !/^[a-z]+:(b2|c2):\d{1,3}$/.test(one)) throw new Error('Invalid lesson');
              const native = process.env.REQUESTED_NATIVE || 'uz';
              if (!natives.includes(native)) throw new Error('Unsupported native language');
              const value = one ? one.split(':')[0] : (process.env.REQUESTED_LANGS || 'all');
              const langs = value === 'all' ? allowed : [...new Set(value.split(',').map(s => s.trim()))];
              if (!langs.length || langs.some(l => !allowed.includes(l))) throw new Error('Unsupported target language');
              jobs = langs.map(lang => ({ lang, native }));
            }
            out('jobs', jobs.slice(0, 16));
            out('run', jobs.length ? 'true' : 'false');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

  render:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ffmpeg, shriftlar va brauzer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-core
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Darslarni yaratish va yuklash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NATIVE_LANG: ${{ matrix.native }}
          TARGET_LANG: ${{ matrix.lang }}
          VIDEO_BATCH: ${{ github.event.inputs.batch || '4' }}
          VIDEO_VOICE: ${{ github.event.inputs.voice || 'azure' }}
          VIDEO_MODE: ${{ github.event.inputs.mode || 'demand' }}
          ONE_LESSON: ${{ github.event.inputs.lesson }}
          TTS_MONTHLY_CHARS: ${{ vars.TTS_MONTHLY_CHARS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          node scripts/render-lesson-video.mjs --auto \
            --langs "$TARGET_LANG" \
            --native "$NATIVE_LANG" \
            --batch "$VIDEO_BATCH" \
            ${ONE_LESSON:+--only "$ONE_LESSON"} \
            --out out/videos
