# Supabase bepul loyihasi 1 hafta faolsiz qolsa pauza qilinadi. Har kuni bitta
# kichik o'qish so'rovi yuboramiz — loyiha doim "faol" bo'lib turadi.
name: Supabase uyg'otgich
on:
  schedule:
    - cron: '17 3 * * *'      # har kuni 08:17 (Toshkent)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bazaga kichik so'rov
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
            const fsdb = require('./netlify/functions/_firestore.js');
            fsdb.getDoc('courseLessons/v4_uz_english_b2_0')
              .then(d => { console.log(d ? '✅ Supabase javob berdi' : '⚠️ javob bo\'sh'); })
              .catch(e => { console.error('❌', e.message); process.exit(1); });
          "
