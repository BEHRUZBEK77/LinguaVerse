# Koreyscha ovoz (MeloTTS) sinovi: o'rnatish, bitta gap, vaqt. Natija artifact sifatida.
name: Koreys ovoz sinovi
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: MeloTTS o'rnatish
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: Koreyscha gap
        run: |
          mkdir -p out
          start=$(date +%s)
          printf '%s\n' '{"text":"안녕하세요. 저는 한국어 선생님입니다. 오늘은 인사하는 방법을 배워 봅시다.","out":"out/ko1.wav"}' '{"text":"감사합니다. 이것은 책입니다. 저것은 의자예요.","out":"out/ko2.wav","speed":0.9}' | python3 scripts/tts/melo_server.py KR
          echo "vaqt: $(( $(date +%s) - start )) s"
          ls -la out; for f in out/*.wav; do ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: koreys-ovoz, path: out/*.wav }
