name: Validate LinguaVerse

on:
  push:
    branches: [main, master]
    paths-ignore: ['content/**']
  pull_request:
    paths-ignore: ['content/**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node --check desktop/main.cjs
      - run: node --check js/app-downloads.mjs

