    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg, #0B0D12); color: var(--text, #F3EEE4); font-family: var(--font-body, Inter, system-ui, sans-serif); padding: 24px 16px; box-sizing: border-box; }

    .code { font-family: 'Lora', Georgia, serif; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; color: var(--gold, #C9A45C); margin: 0 0 8px; }
    h1 { font-family: 'Lora', Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 10px; }
    p { color: var(--text3, #9aa0ad); line-height: 1.6; margin: 0 0 22px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a { display: inline-flex; padding: 11px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; background: var(--surface2, #1a1d26); color: var(--text, #F3EEE4); border: 1px solid var(--border, #2a2e3a); }
    a.main { background: var(--accent, #2346D8); color: #fff; border-color: transparent; }
  </style>
