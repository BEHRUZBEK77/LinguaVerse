<!doctype html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yangi parol — LinguaVerse</title>
  <link rel="stylesheet" href="../css/lv-theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    .box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px; }
    h1 { font-family: var(--font-head); font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--text3); line-height: 1.6; margin: 0 0 14px; }
    input { width: 100%; padding: 12px 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font: inherit; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #0b1216; font: inherit; font-weight: 800; cursor: pointer; }
    .msg { margin-top: 12px; font-size: .9rem; }
  </style>
  <script src="/js/learning-language.js"></script>
  <script type="module" src="/js/site-language.mjs"></script>
</head>
<body>
  <div class="box">
    <h1>Yangi parol o'rnatish</h1>
    <p>Kamida 6 belgidan iborat yangi parol kiriting.</p>
    <input id="p1" type="password" placeholder="Yangi parol" autocomplete="new-password">
    <input id="p2" type="password" placeholder="Parolni takrorlang" autocomplete="new-password">
    <button id="btn">Saqlash</button>
    <div class="msg" id="msg"></div>
  </div>
  <script type="module">
    import { supabase } from '/js/fb/client.js';
    const $ = id => document.getElementById(id);
    const say = (t, ok) => { $('msg').textContent = t; $('msg').style.color = ok ? 'var(--green)' : '#fca5a5'; };
    const { data } = await supabase.auth.getSession();
    if (!data?.session) say("Havola eskirgan yoki noto'g'ri. Parolni tiklashni qaytadan so'rang.");
    $('btn').onclick = async () => {
      const a = $('p1').value, b = $('p2').value;
      if (a.length < 6) return say('Parol kamida 6 belgi bo‘lsin.');
      if (a !== b) return say('Parollar bir xil emas.');
      $('btn').disabled = true;
      const { error } = await supabase.auth.updateUser({ password: a });
      $('btn').disabled = false;
      if (error) return say('Saqlanmadi: ' + error.message);
      say('Parol yangilandi! Yo‘naltirilmoqda…', true);
      setTimeout(() => { location.href = '/select-language.html'; }, 1200);
    };
  </script>
</body>
</html>
