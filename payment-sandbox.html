<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaVerse — Sinov to'lovi</title>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    :root {
      --bg: #04060f; --surface: #0b0f1e; --surface2: #111629;
      --border: rgba(255,255,255,0.07); --accent: #4f6ef7; --accent2: #a78bfa;
      --gold: #f5c842; --green: #34d399; --red: #f87171;
      --text: #e8ecff; --muted: #7580a8;
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(79,110,247,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(79,110,247,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
    nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; height: 62px; background: rgba(4,6,15,0.8); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.2rem; font-weight: 800; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 8px; }
    .nav-links a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 0.78rem; font-weight: 600; padding: 7px 13px; border-radius: 10px; transition: all .2s; white-space: nowrap; }
    .nav-links a:hover { color: var(--text); background: var(--surface); }
    .wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 60px 18px 90px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px 28px; text-align: center; }
    .badge { display: inline-block; background: rgba(245,200,66,.14); border: 1px solid rgba(245,200,66,.35); color: var(--gold); font-size: 0.72rem; font-weight: 800; padding: 5px 14px; border-radius: 100px; margin-bottom: 18px; }
    .plan-ic { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .st-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
    .st-sub { color: var(--muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 8px; }
    .amount { font-size: 2rem; font-weight: 800; margin: 12px 0 20px; color: var(--gold); }
    .amount small { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .order-id { font-size: 0.75rem; color: var(--muted); margin-bottom: 24px; }
    .order-id b { color: var(--text); font-family: monospace; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 30px; border-radius: 14px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #fff; transition: all .2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-sandbox { background: linear-gradient(135deg, #f59e0b, #f5c842); color: #1a1200; box-shadow: 0 8px 28px rgba(245,158,11,.35); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .result { margin-top: 18px; font-size: 0.85rem; line-height: 1.6; }
    .note { margin-top: 20px; font-size: 0.72rem; color: var(--muted); line-height: 1.6; }
    .fa, .fas, .far, .fab, .fa-solid, .fa-regular,
    .fa::before, .fas::before, .far::before, .fa-solid::before, .fa-regular::before { font-family: "Font Awesome 6 Free" !important; }
    .fa-solid, .fas, .fa-solid::before, .fas::before { font-weight: 900; }
  </style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="css/lv-theme.css">
</head>

<body>
  <nav>
    <a href="index.html" class="logo">Lingua<span>Verse</span></a>
    <div class="nav-links">
      <a href="index.html"><i class="fa-solid fa-house"></i> Bosh sahifa</a>
      <a href="select-language.html"><i class="fa-solid fa-globe"></i> Tillar</a>
      <a href="languages-html/shop.html"><i class="fa-solid fa-bag-shopping"></i> Do'kon</a>
      <a href="languages-html/profile.html"><i class="fa-solid fa-user"></i> Profil</a>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <div class="badge"><i class="fa-solid fa-flask"></i> SINOV REJIMI</div>
      <div class="plan-ic" id="planIc" style="background:rgba(79,110,247,.12);color:var(--accent)"><i class="fa-solid fa-crown"></i></div>
      <div class="st-title" id="planName">Reja</div>
      <div class="st-sub">Haqiqiy pul o'tmaydi — butun to'lov oqimi sinab ko'riladi.</div>
      <div class="amount" id="amount">— <small>so'm</small></div>
      <div class="order-id">Buyurtma: <b id="orderId">—</b></div>
      <button class="btn btn-sandbox" id="confirmBtn" onclick="confirmSandbox()">
        <i class="fa-solid fa-flask"></i> To'lovni tasdiqlash (sinov)
      </button>
      <div class="result" id="result"></div>
      <div class="note">
        Bu sahifa faqat <b>INPAY_SANDBOX=1</b> rejimida ko'rsatiladi. Haqiqiy ishlab
        chiqarishda foydalanuvchi to'g'ridan-to'g'ri inpay.uz sahifasiga o'tadi.
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const FB_CONFIG = {
      apiKey: "AIzaSyB-QDASPCTIKCx445PpeKFKC8fWydKHMcI",
      authDomain: "linguaverse-81b52.firebaseapp.com",
      projectId: "linguaverse-81b52",
      storageBucket: "linguaverse-81b52.firebasestorage.app",
      messagingSenderId: "1037869292716",
      appId: "1:1037869292716:web:567bf2c9f9ed0862941309",
      measurementId: "G-H8WH5FTTEY"
    };
    const app = getApps().length ? getApp() : initializeApp(FB_CONFIG);
    const auth = getAuth(app);

    const PLAN_META = {
      nova:    { name: 'NOVA',    ic: 'fa-bolt',  col: '#3b82f6' },
      mega:    { name: 'MEGA',    ic: 'fa-rocket',col: '#8b5cf6' },
      premium: { name: 'PREMIUM', ic: 'fa-crown', col: '#f59e0b' }
    };

    const params = new URLSearchParams(location.search);
    const orderId = params.get('order');
    const amount = params.get('amount');
    const planId = params.get('plan');
    const meta = PLAN_META[planId] || { name: planId || 'Reja', ic: 'fa-crown', col: '#4f6ef7' };

    document.getElementById('orderId').textContent = orderId || '—';
    document.getElementById('planName').textContent = meta.name;
    document.getElementById('planIc').style.background = meta.col + '18';
    document.getElementById('planIc').style.color = meta.col;
    document.getElementById('planIc').innerHTML = `<i class="fa-solid ${meta.ic}"></i>`;
    document.getElementById('amount').innerHTML = (amount ? Number(amount).toLocaleString('ru-RU') : '—') + ' <small>so\'m</small>';

    const $ = id => document.getElementById(id);

    window.confirmSandbox = async function () {
      const btn = $('confirmBtn');
      if (!orderId) { $('result').innerHTML = '<div style="color:var(--red)">Buyurtma raqami yo\'q.</div>'; return; }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Tasdiqlanmoqda...';

      try {
        const idToken = await auth.currentUser.getIdToken();
        const resp = await fetch('/.netlify/functions/payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'sandbox-confirm', idToken, orderId })
        });
        const data = await resp.json();

        if (!resp.ok || data.error) {
          throw new Error(data.error || "Tasdiqlash amalga oshmadi");
        }

        $('result').innerHTML =
          `<div style="background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:10px;padding:12px;color:var(--green)">` +
          `<i class="fa-solid fa-check-circle"></i> ${meta.name} reja sinov rejimida yoqildi!<br>` +
          `<small style="opacity:.75">Natija sahifasiga o'tilmoqda...</small></div>`;

        setTimeout(() => { window.location.href = 'payment-result.html?order=' + orderId; }, 1500);
      } catch (e) {
        console.error('[sandbox]', e);
        $('result').innerHTML =
          `<div style="background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px;color:var(--red)">` +
          `<i class="fa-solid fa-circle-xmark"></i> ${e.message}</div>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-flask"></i> Qayta urinish';
      }
    };

    onAuthStateChanged(auth, user => {
      if (!user) {
        sessionStorage.setItem('intendedWorld', location.href);
        window.location.href = 'auth/login.html';
      }
    });
  </script>
</body>
</html>
