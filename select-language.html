<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
     font-family: 'Cinzel', serif;

    }

    :root {
      --bg: #0a0a0f;
      --bg2: #12121a;
      --card: #16161f;
      --border: rgba(255, 255, 255, 0.07);
      --accent: #4f6ef7;
      --accent2: #a78bfa;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --gold: #f5c842;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden
    }

    /* BG ORBS */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: rgba(79, 110, 247, 0.12);
      top: -100px;
      left: -100px
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(167, 139, 250, 0.08);
      bottom: -80px;
      right: -80px
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: rgba(245, 200, 66, 0.05);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%)
    }

    /* NAVBAR */
    nav#navbar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 40px;
      height: 64px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 21, 28, .96);
      backdrop-filter: blur(18px);
      transition: background .2s, border-color .2s
    }

    nav.scrolled {
      background: rgba(15, 21, 28, .98);
      border-color: var(--border2)
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none
    }

    .logo span {
      color: var(--accent)
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(1200px, 100%);
      min-width: 0;
      margin: 0 auto
    }

    .nav-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem
    }

    .nav-username {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: min(26vw, 220px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .plan-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'Syne', sans-serif
    }

    .plan-badge.free {
      background: rgba(107, 107, 128, 0.15);
      color: var(--muted);
      border: 1px solid rgba(107, 107, 128, 0.2)
    }

    .plan-badge.nova {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3)
    }

    .plan-badge.mega {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3)
    }

    .plan-badge.premium {
      background: rgba(245, 200, 66, 0.15);
      color: var(--gold);
      border: 1px solid rgba(245, 200, 66, 0.3)
    }

    .nav-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: all 0.2s
    }

    .nav-logout:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text)
    }

    /* HERO */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 120px 20px 60px
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(79, 110, 247, 0.1);
      border: 1px solid rgba(79, 110, 247, 0.2);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
      animation: fadeUp 0.6s ease 0.1s both
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 500px;
      margin: 0 auto;
      animation: fadeUp 0.6s ease 0.2s both
    }

    /* SEARCH */
    .search-wrap {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 32px auto 0;
      animation: fadeUp 0.6s ease 0.3s both
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 20px 14px 48px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: all 0.3s
    }

    .search-input::placeholder {
      color: var(--muted)
    }

    .search-input:focus {
      border-color: rgba(79, 110, 247, 0.4);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.08)
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.1rem
    }

    /* FILTER TABS */
    .filter-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease 0.35s both
    }

    .ftab {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif
    }

    .ftab:hover {
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text)
    }

    .ftab.active {
      background: rgba(79, 110, 247, 0.15);
      border-color: rgba(79, 110, 247, 0.4);
      color: var(--accent)
    }

    /* LANGUAGES GRID */
    .languages-section {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px
    }

    .section-label {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px
    }

    .profile-status {
      margin: 0 0 20px;
      padding: 12px 16px;
      border: 1px solid rgba(245, 200, 66, 0.25);
      border-radius: 12px;
      background: rgba(245, 200, 66, 0.08);
      color: var(--gold);
      text-align: center;
      font-size: 0.9rem
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px
    }

    /* LANGUAGE CARD */
    .lang-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.5s ease both
    }

    .lang-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--card-accent, rgba(79, 110, 247, 0.05)), transparent);
      opacity: 0;
      transition: opacity 0.3s
    }

    .lang-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3)
    }

    .lang-card:hover::before {
      opacity: 1
    }

    .lang-card.coming-soon {
      opacity: 0.5;
      cursor: not-allowed
    }

    .lang-card.coming-soon:hover {
      transform: none;
      box-shadow: none
    }

    .lang-flag {
      font-size: 2.8rem;
      margin-bottom: 16px;
      display: block;
      line-height: 1
    }

    .lang-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px
    }

    .lang-native {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 12px
    }

    .lang-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .lang-stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.7rem;
      color: var(--muted)
    }

    .lang-progress-wrap {
      margin-bottom: 12px
    }

    .lang-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px
    }

    .lang-progress-bar-bg {
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden
    }

    .lang-progress-bar {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 1s ease
    }

    .lang-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600
    }

    .lang-badge.available {
      background: rgba(52, 211, 153, 0.1);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.2)
    }

    .lang-badge.soon {
      background: rgba(107, 107, 128, 0.1);
      color: var(--muted);
      border: 1px solid var(--border)
    }

    .lang-badge.new {
      background: rgba(245, 200, 66, 0.1);
      color: var(--gold);
      border: 1px solid rgba(245, 200, 66, 0.2)
    }

    .lang-arrow {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.2rem;
      transition: all 0.3s;
      opacity: 0
    }

    .lang-card:hover .lang-arrow {
      opacity: 1;
      right: 16px
    }

    /* POPULAR SECTION */
    .popular-tag {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(245, 200, 66, 0.15);
      border: 1px solid rgba(245, 200, 66, 0.3);
      color: var(--gold);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      font-family: 'Syne', sans-serif
    }

    /* STATS ROW */
    .stats-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 0 auto 48px;
      max-width: 600px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease 0.25s both
    }

    .catalog-nav {
      position: sticky;
      top: 64px;
      z-index: 99;
      border-bottom: 1px solid var(--border);
      background: rgba(16, 21, 27, .92);
      backdrop-filter: blur(16px);
    }

    .catalog-nav-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      width: min(1200px, 100%);
      min-height: 48px;
      margin: auto;
      padding: 6px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .catalog-nav-inner::-webkit-scrollbar { display: none; }

    .catalog-nav a {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--text2);
      font-size: .79rem;
      font-weight: 650;
      text-decoration: none;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
    }

    .catalog-nav a:hover,
    .catalog-nav a[aria-current="page"] {
      border-color: var(--border2);
      background: var(--surface2);
      color: var(--text);
    }

    .catalog-nav a[aria-current="page"] {
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 11%, transparent);
      color: var(--accent);
    }

    .stat-item {
      text-align: center
    }

    .stat-n {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .stat-l {
      font-size: 0.75rem;
      color: var(--muted)
    }

    /* NO RESULTS */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted)
    }

    .no-results span {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* RESPONSIVE */
    @media(max-width:600px) {
      nav#navbar {
        padding: 0 14px
      }

      .hero {
        padding: 34px 20px 28px
      }

      .lang-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px
      }

      @media (max-width: 420px) {
        nav#navbar { padding: 0 10px; }
        .nav-user { gap: 7px; }
        .nav-username { max-width: 74px; }
        .nav-logout { padding: 6px 8px; font-size: .72rem; }
        .plan-badge { padding: 4px 7px !important; font-size: .65rem !important; }
        .catalog-nav-inner { padding-right: 12px; padding-left: 12px; }
      }
    }
  </style>

      },
      {
        id: 'french', flag: '🇫🇷', name: 'Fransuz tili', native: 'Français',
        stats: [],
        status: 'soon', popular: false, color: 'rgba(107,107,128,0.05)',
        url: null, progress: 0,
        desc: 'Yangi kurs tayyorlanmoqda'
      },
      {
        id: 'japanese', flag: '🇯🇵', name: 'Yapon tili', native: '日本語',
        stats: [],
        status: 'soon', popular: false, color: 'rgba(107,107,128,0.05)',
        url: null, progress: 0,
        desc: 'Yangi kurs tayyorlanmoqda'
      },
    ];

    let currentFilter = 'all';
    let searchQuery = '';
    let userProgress = {};
    let userPlan = 'free';

    window.setFilter = function (filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.ftab').forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-pressed', 'false');
      });
      el.classList.add('active');
      el.setAttribute('aria-pressed', 'true');
      renderLangs();
    };

    window.filterLangs = function () {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      renderLangs();
    };

    function renderLangs() {
      const grid = document.getElementById('langGrid');
      let langs = LANGUAGES.filter(l => {
        const matchSearch = !searchQuery ||
          l.name.toLowerCase().includes(searchQuery) ||
          l.native.toLowerCase().includes(searchQuery);
        const matchFilter = currentFilter === 'all' ||
          (currentFilter === 'available' && l.status === 'available') ||
          (currentFilter === 'soon' && l.status === 'soon') ||
          (currentFilter === 'popular' && l.popular);
        return matchSearch && matchFilter;
      });

      if (!langs.length) {
        document.getElementById('courseCount').textContent = '0 ta';
        grid.innerHTML = `<div class="no-results" style="grid-column:1/-1"><span><i class="fa-solid fa-magnifying-glass"></i></span><p>Til topilmadi</p></div>`;
        return;
      }

      document.getElementById('courseCount').textContent = `${langs.length} ta`;
      grid.innerHTML = langs.map((l, i) => {
        const prog = userProgress[l.id] || 0;
        const isAvailable = l.status === 'available';
        const tag = isAvailable ? 'a' : 'div';
        const openAttrs = isAvailable
          ? `href="${l.url}" aria-label="${l.name} kursini ochish"`
          : `role="button" tabindex="0" aria-label="${l.name} kursi tez kunda ochiladi" onclick="showComingSoon()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showComingSoon()}"`;
        return `
      <${tag} class="lang-card${!isAvailable ? ' coming-soon' : ''}"
           ${openAttrs}
           style="--card-accent:${l.color};animation-delay:${i * 0.05}s">
        ${l.popular ? '<div class="popular-tag"><i class="fa-solid fa-fire" style="color:#fb923c"></i> Mashhur</div>' : ''}
        <span class="lang-flag">${l.flag}</span>
        <div class="lang-name">${l.name}</div>
        <div class="lang-native">${l.native}</div>
        <p class="lang-description">${l.desc}</p>
        ${l.stats.length ? `<div class="lang-stats">
          ${l.stats.map(s => `<span class="lang-stat">${s}</span>`).join('')}
        </div>` : ''}
        ${prog > 0 ? `
        <div class="lang-progress-wrap">
          <div class="lang-progress-label"><span>Taraqqiyot</span><span>${prog}%</span></div>
          <div class="lang-progress-bar-bg"><div class="lang-progress-bar" style="width:${prog}%"></div></div>
        </div>` : ''}
        <span class="lang-badge ${l.status === 'available' ? 'available' : l.status === 'soon' ? 'soon' : 'new'}">
          ${l.status === 'available' ? '<i class="fa-solid fa-check" style="color:#34d399"></i> Mavjud' : '⏳ Tez kunda'}
        </span>
        <div class="lang-arrow"><i class="fa-solid fa-arrow-right"></i></div>
      </${tag}>
    `;
      }).join('');
    }

    window.goToLang = function (url) {
      if (!url) return;
      window.location.href = url;
    };

    window.showComingSoon = function () {
      alert('Bu til tez kunda qo\'shiladi! 🚀');
    };

    renderLangs();

    async function initializeFirebase() {
      const [appModule, authModule, firestoreModule] = await Promise.all([
        import("/js/fb/firebase-app.js"),
        import("/js/fb/firebase-auth.js"),
        import("/js/fb/firebase-firestore.js")
      ]);
      const app = appModule.initializeApp(firebaseConfig);
      const auth = authModule.getAuth(app);
      const db = firestoreModule.getFirestore(app);
      let isSigningOut = false;

      window.logout = async function () {
        const button = document.querySelector('#navUser .nav-logout');
        if (button) button.disabled = true;
        isSigningOut = true;
        try {
          await authModule.signOut(auth);
          window.location.replace('auth/login.html');
        } catch (error) {
          isSigningOut = false;
          if (button) button.disabled = false;
          console.error('Hisobdan chiqishda xatolik:', error);
          const status = document.getElementById('profileLoadStatus');
          status.textContent = 'Hisobdan chiqib bo‘lmadi. Iltimos, qayta urinib ko‘ring.';
          status.hidden = false;
        }
      };

      authModule.onAuthStateChanged(auth, async (user) => {
        if (!user) {
          const redirect = isSigningOut ? '' : '?redirect=select-language';
          window.location.replace(`auth/login.html${redirect}`);
          return;
        }

        const name = user.displayName?.trim() || user.email?.split('@')[0] || 'O‘quvchi';
        const initial = name.charAt(0).toUpperCase();
        const status = document.getElementById('profileLoadStatus');
        status.hidden = true;
        status.textContent = '';

        try {
          const snap = await firestoreModule.getDoc(firestoreModule.doc(db, 'users', user.uid));
          if (snap.exists()) {
            const data = snap.data();
            userPlan = data.plan || 'free';
            userProgress = data.langProgress || {};
          }
        } catch (error) {
          console.error('Profil ma’lumotlarini yuklashda xatolik:', error);
          status.textContent = 'Taraqqiyot ma’lumotlarini yuklab bo‘lmadi. Kurslarni tanlashda davom etishingiz mumkin.';
          status.hidden = false;
        }

        const planLabels = { free: 'Free <i class="fa-solid fa-seedling" style="color:#34d399"></i>', nova: 'NOVA <i class="fa-solid fa-bolt" style="color:#3b82f6"></i>', mega: 'MEGA <i class="fa-solid fa-rocket" style="color:#8b5cf6"></i>', premium: 'PREMIUM <i class="fa-solid fa-crown" style="color:#f59e0b"></i>' };
        const planBadge = document.createElement('span');
        planBadge.className = `plan-badge ${userPlan}`;
        planBadge.innerHTML = planLabels[userPlan] || 'Free';

        const avatar = document.createElement('div');
        avatar.className = 'nav-avatar';
        avatar.textContent = initial;

        const username = document.createElement('span');
        username.className = 'nav-username';
        username.textContent = name;

        const logoutButton = document.createElement('button');
        logoutButton.className = 'nav-logout';
        logoutButton.type = 'button';
        logoutButton.textContent = 'Chiqish';
        logoutButton.addEventListener('click', window.logout);

        document.getElementById('navUser').replaceChildren(planBadge, avatar, username, logoutButton);
        renderLangs();
      });
    }

    initializeFirebase().catch((error) => {
      console.error('Firebase ishga tushmadi:', error);
      const status = document.getElementById('profileLoadStatus');
      status.textContent = 'Profil ma’lumotlari hozircha yuklanmadi. Til kurslarini ko‘rish va qidirish mumkin.';
      status.hidden = false;
    });


    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
    });
  </script>
</body>

</html>
